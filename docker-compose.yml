services:
  postgres:
    image: postgres:16-alpine
    container_name: ledyim-farm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm_password
      POSTGRES_DB: ledyim_farm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d ledyim_farm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
